<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nintendo DS Browser Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .upload-card {
            background: #1a1a22;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #2d2d3a;
        }
        .upload-card h2 {
            margin-bottom: 8px;
            font-size: 1.5rem;
        }
        .upload-card p {
            color: #8a8a9e;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .file-label {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3b82f6;
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .file-label:hover {
            background-color: #2563eb;
        }
        .file-label:active {
            transform: scale(0.98);
        }
        #rom-input {
            display: none;
        }
        #game-container {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 85vh;
            display: none; /* Hidden until a ROM is selected */
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- ROM Upload Card -->
    <div class="upload-card" id="upload-box">
        <h2>Select Nintendo DS Game</h2>
        <p>Upload a local <strong>.nds</strong> or <strong>.zip</strong> file to start playing directly in your browser.</p>
        <label for="rom-input" class="file-label">Choose File</label>
        <input type="file" id="rom-input" accept=".nds, .zip">
    </div>

    <!-- Emulator Display Window -->
    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        document.getElementById('rom-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Generate an in-memory Object URL for the local file
            const blobUrl = URL.createObjectURL(file);

            // Configure EmulatorJS core variables
            window.EJS_player = '#game';
            window.EJS_core = 'nds';
            window.EJS_gameUrl = blobUrl;
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

            // Hide the upload card and display the game screen
            document.getElementById('upload-box').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            // Dynamically load the EmulatorJS core script
            const loaderScript = document.createElement('script');
            loaderScript.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            document.body.appendChild(loaderScript);
        });
    </script>

</body>
</html>
